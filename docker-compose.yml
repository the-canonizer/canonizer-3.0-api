services:
  db:
    image: mysql:8.0
    restart: always
    tty: true
    container_name: canonizer_database
    environment:
      MYSQL_DATABASE: canonizer_3
      MYSQL_ROOT_PASSWORD: root
    command: mysqld --default-authentication-plugin=mysql_native_password
    networks:
      - app-network
    volumes:
      - ./database/mysql-data:/var/lib/mysql:rw
  api:
    container_name: canonizer_api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://root:root@db:3306/canonizer_3
    ports:
      - 8000:8000
    command: php -S 0.0.0.0:8000 public/index.php
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - db
networks:
  app-network:
    driver: bridge
volumes:
  mysql-data:
